<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Foco Diário</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: cabeçalho com data e tema, resumo de progresso, formulário de nova tarefa, duas colunas (pendentes / concluídas) que empilham no celular */
:root {
  --bg: #F3F5F9;
  --surface: #FFFFFF;
  --surface-2: #ECEFF5;
  --line: #DCE1EA;
  --line-strong: #B8C1D1;
  --fg: #141A26;
  --muted: #5B687B;
  --accent: #2457F5;
  --accent-fg: #FFFFFF;
  --done: #12936B;
  --danger: #D23B4B;
  --shadow: 0 1px 2px rgba(20, 26, 38, .06), 0 6px 18px rgba(20, 26, 38, .05);
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1219;
    --surface: #161C26;
    --surface-2: #1D2531;
    --line: #28323F;
    --line-strong: #44516A;
    --fg: #E7EBF2;
    --muted: #93A0B4;
    --accent: #6C93FF;
    --accent-fg: #0B1220;
    --done: #3CCB9A;
    --danger: #FF7A87;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1219;
  --surface: #161C26;
  --surface-2: #1D2531;
  --line: #28323F;
  --line-strong: #44516A;
  --fg: #E7EBF2;
  --muted: #93A0B4;
  --accent: #6C93FF;
  --accent-fg: #0B1220;
  --done: #3CCB9A;
  --danger: #FF7A87;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
  min-height: 100%;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

/* Cabeçalho */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
.eyebrow { font-size: 13px; color: var(--muted); letter-spacing: .02em; text-transform: capitalize; margin: 0 0 2px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 5vw, 38px); line-height: 1.1; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
.icon-btn {
  width: 42px; height: 42px; flex: none; display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--fg);
  transition: border-color .15s, background .15s;
}
.icon-btn:hover { border-color: var(--line-strong); }
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Progresso */
.progress { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow); display: grid; gap: 10px; }
.progress-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.progress-row strong { font-family: var(--font-display); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.progress-row span { color: var(--muted); font-size: 13px; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--done); border-radius: 99px; transition: width .5s cubic-bezier(.2,.8,.2,1); }

/* Formulário */
.composer { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); display: grid; gap: 10px; }
.composer input, .composer textarea {
  width: 100%; background: transparent; border: 0; border-radius: 8px; padding: 8px 10px; outline: none; resize: none;
}
.composer input { font-family: var(--font-display); font-weight: 500; font-size: 17px; }
.composer textarea { color: var(--fg); font-size: 14px; min-height: 56px; }
.composer input::placeholder, .composer textarea::placeholder { color: var(--muted); }
.composer .fields { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); transition: border-color .15s, box-shadow .15s; }
.composer .fields:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
.composer .fields.error { border-color: var(--danger); }
.composer .fields hr { border: 0; border-top: 1px solid var(--line); margin: 0 10px; }
.composer-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: 12.5px; min-height: 18px; }
.hint.error { color: var(--danger); }
.btn-primary {
  background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 12px; padding: 10px 18px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 8px; transition: transform .1s, filter .15s;
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary:active { transform: translateY(1px); }
.btn-primary svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }

/* Colunas */
.columns { display: grid; grid-template-columns: 1fr; gap: 24px; align-items: start; }
@media (min-width: 880px) { .columns { grid-template-columns: 1.25fr 1fr; gap: 28px; } }
.col { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.col-head { display: flex; align-items: center; gap: 10px; padding: 0 2px; }
.col-head h2 { font-family: var(--font-display); font-size: 17px; font-weight: 600; margin: 0; }
.count { font-size: 12.5px; font-weight: 600; min-width: 24px; text-align: center; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); font-variant-numeric: tabular-nums; }
.col.pending .count { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.col.finished .count { background: color-mix(in srgb, var(--done) 16%, transparent); color: var(--done); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }

/* Cartão de tarefa */
.task {
  display: flex; align-items: flex-start; gap: 12px; padding: 14px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  transition: border-color .15s, opacity .25s, transform .25s;
}
.task:hover { border-color: var(--line-strong); }
.task.enter { animation: enter .3s ease-out; }
.task.leaving { opacity: 0; transform: translateX(12px); }
@keyframes enter { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.check {
  width: 26px; height: 26px; flex: none; border-radius: 50%; border: 2px solid var(--line-strong); background: transparent;
  display: grid; place-items: center; margin-top: 1px; padding: 0; transition: background .2s, border-color .2s;
}
.check:hover { border-color: var(--done); }
.check svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .3s .08s ease-out; }
.task.done .check { background: var(--done); border-color: var(--done); }
.task.done .check svg { stroke-dashoffset: 0; }
.task.pop .check { animation: pop .42s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.28); } 100% { transform: scale(1); } }
.body { flex: 1; min-width: 0; }
.title { font-weight: 600; margin: 0; overflow-wrap: anywhere; transition: color .2s; }
.desc { margin: 2px 0 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
.meta { margin: 6px 0 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.task.done .title { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.task.done .desc { opacity: .8; }
.del { width: 34px; height: 34px; flex: none; display: grid; place-items: center; background: transparent; border: 0; border-radius: 10px; color: var(--muted); margin: -4px -4px 0 0; transition: background .15s, color .15s; }
.del:hover { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
.del svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.empty { border: 1.5px dashed var(--line-strong); border-radius: 14px; padding: 26px 18px; text-align: center; color: var(--muted); font-size: 14px; }
.empty b { display: block; color: var(--fg); font-family: var(--font-display); font-weight: 600; font-size: 15px; margin-bottom: 2px; }

.foot { color: var(--muted); font-size: 12.5px; text-align: center; }

/* Aviso temporário */
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
  max-width: calc(100% - 32px); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 12px;
  display: flex; align-items: center; gap: 14px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { background: transparent; border: 0; color: inherit; font-weight: 600; text-decoration: underline; padding: 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
</style>

<main class="app">
  <header class="top">
    <div>
      <p class="eyebrow" id="today"></p>
      <h1>Foco Diário</h1>
    </div>
    <button class="icon-btn" id="theme" type="button" aria-label="Alternar modo claro e escuro"></button>
  </header>

  <section class="progress" aria-live="polite">
    <div class="progress-row">
      <strong id="progress-text">0 de 0 concluídas</strong>
      <span id="progress-sub">Carregando…</span>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </section>

  <form class="composer" id="form" novalidate>
    <div class="fields" id="fields">
      <input id="f-title" type="text" maxlength="120" placeholder="O que precisa ser feito hoje?" autocomplete="off" aria-label="Título da tarefa">
      <hr>
      <textarea id="f-desc" maxlength="500" placeholder="Descrição (opcional): detalhes, links, contexto…" aria-label="Descrição da tarefa"></textarea>
    </div>
    <div class="composer-foot">
      <span class="hint" id="hint">Enter adiciona a tarefa. Use Shift+Enter para quebrar linha na descrição.</span>
      <button class="btn-primary" type="submit">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Adicionar tarefa
      </button>
    </div>
  </form>

  <div class="columns">
    <section class="col pending" aria-labelledby="h-pending">
      <div class="col-head"><h2 id="h-pending">Pendentes</h2><span class="count" id="c-pending">0</span></div>
      <ul class="list" id="l-pending"></ul>
    </section>
    <section class="col finished" aria-labelledby="h-done">
      <div class="col-head"><h2 id="h-done">Concluídas</h2><span class="count" id="c-done">0</span></div>
      <ul class="list" id="l-done"></ul>
    </section>
  </div>

  <p class="foot" id="foot"></p>
</main>

<div class="toast" id="toast" role="status"><span id="toast-msg"></span><button type="button" id="toast-act" hidden>Desfazer</button></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var tasks = [];
  var mode = 'loading';          // 'loading' | 'db' | 'local'
  var col = null;                // coleção do banco de dados (por pessoa)
  var loaded = false;
  var busy = {};                 // tarefas com gravação em andamento
  var justDone = null, justAdded = null;
  var LS_TASKS = 'focodiario:tasks', LS_THEME = 'focodiario:theme';

  /* ---------- utilidades ---------- */
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function fmt(ts) {
    try { return new Date(ts).toLocaleString('pt-BR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; }
  }

  /* ---------- tema ---------- */
  var SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  function currentTheme() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t) return t;
    return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function paintThemeIcon() { $('theme').innerHTML = currentTheme() === 'dark' ? SUN : MOON; }
  var savedTheme = lsGet(LS_THEME);
  if (savedTheme === 'dark' || savedTheme === 'light') document.documentElement.setAttribute('data-theme', savedTheme);
  paintThemeIcon();
  $('theme').addEventListener('click', function () {
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    lsSet(LS_THEME, next);
    paintThemeIcon();
  });

  /* ---------- aviso com desfazer ---------- */
  var toastTimer = null, toastAction = null;
  function toast(msg, actionLabel, action) {
    $('toast-msg').textContent = msg;
    var b = $('toast-act');
    toastAction = action || null;
    b.hidden = !action;
    if (actionLabel) b.textContent = actionLabel;
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $('toast').classList.remove('show'); toastAction = null; }, action ? 6000 : 3500);
  }
  $('toast-act').addEventListener('click', function () {
    var a = toastAction; toastAction = null;
    $('toast').classList.remove('show');
    if (a) a();
  });

  /* ---------- persistência ---------- */
  function saveLocal() { lsSet(LS_TASKS, JSON.stringify(tasks)); }
  function loadLocal() {
    try { var v = JSON.parse(lsGet(LS_TASKS) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; }
  }
  function newLocalId() { return 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function dataOf(t) { return { title: t.title, desc: t.desc || '', done: !!t.done, createdAt: t.createdAt, doneAt: t.doneAt || null }; }

  function addTask(title, desc) {
    var data = { title: title, desc: desc, done: false, createdAt: Date.now(), doneAt: null };
    if (mode === 'db') {
      var ref = col.doc();
      justAdded = ref.id;
      return ref.set(data).catch(function () { justAdded = null; toast('Não foi possível salvar a tarefa. Tente de novo.'); });
    }
    var t = Object.assign({ id: newLocalId() }, data);
    justAdded = t.id;
    tasks.push(t); saveLocal(); render();
    return Promise.resolve();
  }

  function toggleTask(t) {
    if (busy[t.id]) return;
    var done = !t.done;
    var patch = { done: done, doneAt: done ? Date.now() : null };
    justDone = done ? t.id : null;
    if (mode === 'db') {
      busy[t.id] = true;
      col.doc(t.id).update(patch)
        .catch(function () { justDone = null; toast('Não foi possível atualizar a tarefa.'); })
        .then(function () { delete busy[t.id]; });
      return;
    }
    Object.assign(t, patch); saveLocal(); render();
  }

  function removeTask(t, li) {
    if (busy[t.id]) return;
    var snapshot = dataOf(t), id = t.id;
    function undo() {
      if (mode === 'db') { col.doc(id).set(snapshot).catch(function () { toast('Não foi possível restaurar a tarefa.'); }); }
      else { tasks.push(Object.assign({ id: id }, snapshot)); saveLocal(); render(); }
    }
    li.classList.add('leaving');
    setTimeout(function () {
      if (mode === 'db') {
        busy[id] = true;
        col.doc(id).delete()
          .then(function () { toast('Tarefa excluída.', 'Desfazer', undo); })
          .catch(function () { li.classList.remove('leaving'); toast('Não foi possível excluir a tarefa.'); })
          .then(function () { delete busy[id]; });
      } else {
        tasks = tasks.filter(function (x) { return x.id !== id; });
        saveLocal(); render();
        toast('Tarefa excluída.', 'Desfazer', undo);
      }
    }, 200);
  }

  /* ---------- renderização ---------- */
  var ICON_CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></svg>';
  var ICON_TRASH = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';

  function card(t) {
    var li = el('li', 'task' + (t.done ? ' done' : ''));
    if (justDone === t.id) li.classList.add('pop');
    if (justAdded === t.id) li.classList.add('enter');

    var chk = el('button', 'check');
    chk.type = 'button';
    chk.setAttribute('aria-pressed', t.done ? 'true' : 'false');
    chk.setAttribute('aria-label', (t.done ? 'Reabrir tarefa: ' : 'Concluir tarefa: ') + t.title);
    chk.innerHTML = ICON_CHECK;
    chk.addEventListener('click', function () { toggleTask(t); });

    var body = el('div', 'body');
    body.appendChild(el('p', 'title', t.title));
    if (t.desc) body.appendChild(el('p', 'desc', t.desc));
    body.appendChild(el('p', 'meta', t.done && t.doneAt ? 'Concluída em ' + fmt(t.doneAt) : 'Criada em ' + fmt(t.createdAt)));

    var del = el('button', 'del');
    del.type = 'button';
    del.setAttribute('aria-label', 'Excluir tarefa: ' + t.title);
    del.innerHTML = ICON_TRASH;
    del.addEventListener('click', function () { removeTask(t, li); });

    li.appendChild(chk); li.appendChild(body); li.appendChild(del);
    return li;
  }

  function emptyBox(title, text) {
    var li = el('li', 'empty');
    li.appendChild(el('b', null, title));
    li.appendChild(document.createTextNode(text));
    return li;
  }

  function render() {
    var pending = tasks.filter(function (t) { return !t.done; }).sort(function (a, b) { return b.createdAt - a.createdAt; });
    var done = tasks.filter(function (t) { return t.done; }).sort(function (a, b) { return (b.doneAt || 0) - (a.doneAt || 0); });

    var lp = $('l-pending'), ld = $('l-done');
    lp.textContent = ''; ld.textContent = '';
    if (mode === 'loading') {
      lp.appendChild(emptyBox('Carregando suas tarefas…', 'Só um instante.'));
      ld.appendChild(emptyBox('Carregando…', ''));
    } else {
      if (pending.length) pending.forEach(function (t) { lp.appendChild(card(t)); });
      else lp.appendChild(emptyBox(tasks.length ? 'Tudo em dia' : 'Nenhuma tarefa ainda', tasks.length ? 'Não há tarefas pendentes. Aproveite o momento.' : 'Escreva um título acima e clique em Adicionar tarefa.'));
      if (done.length) done.forEach(function (t) { ld.appendChild(card(t)); });
      else ld.appendChild(emptyBox('Nada concluído por enquanto', 'Clique no círculo de uma tarefa para marcá-la como feita.'));
    }
    justDone = null; justAdded = null;

    $('c-pending').textContent = pending.length;
    $('c-done').textContent = done.length;
    var total = tasks.length;
    $('progress-text').textContent = done.length + ' de ' + total + (total === 1 ? ' concluída' : ' concluídas');
    $('bar').style.width = (total ? Math.round(done.length / total * 100) : 0) + '%';
    $('progress-sub').textContent = mode === 'loading' ? 'Carregando…' :
      !total ? 'Comece adicionando uma tarefa' :
      done.length === total ? 'Dia fechado. Bom trabalho!' :
      (pending.length + (pending.length === 1 ? ' pendente' : ' pendentes'));
    $('foot').textContent = mode === 'db' ? 'Suas tarefas ficam salvas no banco de dados do app e voltam quando você reabrir a página.' :
      mode === 'local' ? 'Banco de dados indisponível aqui. As tarefas ficam salvas neste navegador.' : '';
  }

  /* ---------- formulário ---------- */
  var hint = $('hint'), HINT = hint.textContent;
  function setError(msg) {
    $('fields').classList.toggle('error', !!msg);
    hint.classList.toggle('error', !!msg);
    hint.textContent = msg || HINT;
  }
  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var title = $('f-title').value.trim(), desc = $('f-desc').value.trim();
    if (!title) { setError('Escreva um título para a tarefa.'); $('f-title').focus(); return; }
    if (mode === 'loading') { setError('Aguarde o carregamento terminar.'); return; }
    setError('');
    addTask(title, desc);
    $('f-title').value = ''; $('f-desc').value = '';
    $('f-title').focus();
  });
  $('f-title').addEventListener('input', function () { if ($('f-title').value.trim()) setError(''); });
  $('f-desc').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); }
  });

  /* ---------- inicialização ---------- */
  try { $('today').textContent = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }); } catch (e) {}

  function useLocal(msg) {
    mode = 'local'; col = null;
    tasks = loadLocal();
    render();
    if (msg) toast(msg);
  }

  function startDb(db, uid) {
    col = db.collection('data/users/' + uid);
    mode = 'db';
    var slow = setTimeout(function () {
      if (!loaded) $('progress-sub').textContent = 'Não foi possível alcançar o banco de dados ainda. Os dados podem estar desatualizados.';
    }, 10000);
    col.orderBy('createdAt', 'asc').onSnapshot(function (snap) {
      tasks = snap.docs.map(function (d) { var x = d.data() || {}; return { id: d.id, title: String(x.title || ''), desc: String(x.desc || ''), done: !!x.done, createdAt: x.createdAt || 0, doneAt: x.doneAt || null }; });
      if (!snap.metadata.fromCache) { loaded = true; clearTimeout(slow); }
      render();
    }, function () {
      clearTimeout(slow);
      useLocal('O banco de dados ficou indisponível. Usando o armazenamento deste navegador.');
    });
  }

  mode = 'loading';
  render();
  (async function init() {
    var db = null, uid = null;
    try {
      if (window.claude && window.claude.use) {
        db = await window.claude.use('db');
        var user = await window.claude.use('user');
        uid = user ? await user.id() : null;
      }
    } catch (e) { db = null; }
    if (db && uid) { try { startDb(db, uid); return; } catch (e) {} }
    useLocal();
  })();
})();
</script>

</body></html>
